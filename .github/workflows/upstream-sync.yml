name: Sync Upstream paperclipai/paperclip

on:
  schedule:
    # Toda segunda-feira às 08:00 UTC (05:00 BRT)
    - cron: "0 8 * * 1"
  workflow_dispatch:
    inputs:
      auto_merge:
        description: "Auto-merge se sem conflitos?"
        required: false
        default: "false"
        type: boolean

jobs:
  sync:
    name: Sync from upstream
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout fork
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GH_PAT }}

      - name: Configure git
        run: |
          git config user.name "Conexão Azul Bot"
          git config user.email "conexaoazul.digital@gmail.com"

      - name: Add upstream remote
        run: |
          git remote add upstream https://github.com/paperclipai/paperclip.git || true
          git fetch upstream

      - name: Check for upstream changes
        id: check
        run: |
          BEHIND=$(git rev-list HEAD..upstream/main --count 2>/dev/null || echo 0)
          echo "behind=$BEHIND" >> $GITHUB_OUTPUT
          echo "Upstream está $BEHIND commits à frente"

      - name: Create sync branch
        if: steps.check.outputs.behind != '0'
        run: |
          git checkout -b sync/upstream-$(date +%Y%m%d) || git checkout sync/upstream-$(date +%Y%m%d)

      - name: Merge upstream
        if: steps.check.outputs.behind != '0'
        run: |
          git merge upstream/main \
            --strategy-option=theirs \
            --allow-unrelated-histories \
            -m "chore: sync upstream paperclipai/paperclip $(date +%Y-%m-%d)" \
          || echo "CONFLITO DETECTADO — PR criado para resolução manual"

      - name: Push sync branch
        if: steps.check.outputs.behind != '0'
        run: |
          git push origin HEAD

      - name: Create Pull Request
        if: steps.check.outputs.behind != '0'
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GH_PAT }}
          branch: sync/upstream-${{ github.run_id }}
          title: "chore: sync upstream paperclipai — $(date +%Y-%m-%d)"
          body: |
            ## Sync Automático do Upstream

            Detectadas **${{ steps.check.outputs.behind }}** mudanças no upstream `paperclipai/paperclip`.

            ### Checklist antes de fazer merge:
            - [ ] Revisar mudanças de breaking change
            - [ ] Verificar se customizações da Conexão Azul foram preservadas
            - [ ] Testar build localmente
            - [ ] Aprovar e fazer merge

            **Estratégia usada:** `theirs` (upstream prevalece em conflitos automáticos)
            **Conflitos manuais:** resolver antes do merge

            ---
            *Gerado automaticamente pelo workflow upstream-sync.yml*
          labels: upstream-sync, automated
          draft: false
